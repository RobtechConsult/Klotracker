# iOS-Cloud-Build (kein eigener Mac nötig): baut die Capacitor-App auf einem
# Codemagic-Mac, signiert automatisch und lädt nach TestFlight hoch.
#
# Einmalig in Codemagic einrichten (siehe STORE.md → "iOS-Build in der Cloud"):
#  - Team-Integration "App Store Connect" mit API-Key, Name: klopatra_asc
#  - Umgebungsvariablen-Gruppe "revenuecat" mit VITE_RC_IOS_KEY
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: klopatra_asc
    environment:
      groups:
        - revenuecat
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.robtechconsult.klopatra
      vars:
        APP_STORE_APPLE_ID: "0" # nach Anlage der App in App Store Connect: numerische Apple-ID eintragen
      node: 22
      xcode: latest
    triggering:
      events: [] # nur manuell starten
    scripts:
      - name: Abhängigkeiten
        script: npm ci
      - name: Tests
        script: npm test
      - name: Web-Build + Capacitor-Sync
        script: |
          npm run build
          npx cap sync ios
      - name: Signing-Profile setzen
        script: xcode-project use-profiles
      - name: Build-Nummer hochzählen
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: IPA bauen
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
