<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4f96"/>
      <stop offset="1" stop-color="#152a4f"/>
    </linearGradient>
    <linearGradient id="poop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5793f"/>
      <stop offset="1" stop-color="#6f4423"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe391"/>
      <stop offset="0.55" stop-color="#f0b542"/>
      <stop offset="1" stop-color="#cf8f24"/>
    </linearGradient>
    <linearGradient id="goldFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffedb4"/>
      <stop offset="1" stop-color="#f2c357"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(256 300)">
    <!-- ground shadow -->
    <ellipse cx="0" cy="126" rx="140" ry="22" fill="#00000033"/>

    <!-- chunky soft-serve poop tip peeking above the headcloth -->
    <path d="M0 -92
             C -38 -92 -38 -128 -6 -132
             C -34 -137 -27 -164 2 -162
             C 25 -163 27 -143 10 -136
             C 34 -136 34 -96 0 -92 Z" fill="url(#poop)"/>

    <!-- the pile's face (brown), sized to sit inside the headcloth -->
    <path d="M-68 -14 C -68 -52 68 -52 68 -14 L68 92 C 68 126 -68 126 -68 92 Z"
          fill="url(#poop)"/>

    <!-- Nemes headcloth: gold cap over the top of the pile -->
    <path d="M-122 -18 C -122 -114 122 -114 122 -18 C 68 -44 -68 -44 -122 -18 Z" fill="url(#gold)"/>

    <!-- side lappets (striped), framing a wide face, covering the sides -->
    <path d="M-122 -16 C -130 46 -110 102 -84 132 L-58 132 L-58 -32 C -84 -32 -112 -26 -122 -16 Z" fill="url(#gold)"/>
    <path d="M122 -16 C 130 46 110 102 84 132 L58 132 L58 -32 C 84 -32 112 -26 122 -16 Z" fill="url(#gold)"/>
    <g stroke="#203a6e" stroke-width="7" stroke-linecap="round">
      <line x1="-114" y1="8"  x2="-62" y2="4"/>
      <line x1="-112" y1="38" x2="-62" y2="34"/>
      <line x1="-106" y1="68" x2="-62" y2="64"/>
      <line x1="-98"  y1="98" x2="-62" y2="94"/>
      <line x1="114" y1="8"  x2="62" y2="4"/>
      <line x1="112" y1="38" x2="62" y2="34"/>
      <line x1="106" y1="68" x2="62" y2="64"/>
      <line x1="98"  y1="98" x2="62" y2="94"/>
    </g>

    <!-- brow band with uraeus cobra -->
    <path d="M-116 -20 q116 -44 232 0 l0 20 q-116 -40 -232 0 Z" fill="url(#gold)"/>
    <path d="M0 -30 C -6 -38 -6 -48 0 -54 C 6 -48 6 -38 0 -30 Z" fill="url(#gold)"/>
    <path d="M-15 -52 q15 -20 30 0 q-15 -8 -30 0 Z" fill="url(#gold)" stroke="#cf8f24" stroke-width="2"/>
    <circle cx="0" cy="-58" r="6" fill="#7fd0d8" stroke="#cf8f24" stroke-width="2"/>

    <!-- eyes with Cleopatra winged kohl liner -->
    <circle cx="-38" cy="10" r="23" fill="#fff"/>
    <circle cx="38" cy="10" r="23" fill="#fff"/>
    <circle cx="-34" cy="14" r="10.5" fill="#203a6e"/>
    <circle cx="42" cy="14" r="10.5" fill="#203a6e"/>
    <g stroke="#1a2e57" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M-60 -4 q22 -13 42 -6"/>
      <path d="M-18 2 l17 -9"/>
      <path d="M60 -4 q-22 -13 -42 -6"/>
      <path d="M18 2 l-17 -9"/>
    </g>

    <!-- winking smile -->
    <path d="M-30 52 q32 32 64 0" stroke="#241206" stroke-width="10" fill="none" stroke-linecap="round"/>

    <!-- broad Egyptian collar (usekh) at the base -->
    <path d="M-98 96 q98 68 196 0 l0 26 q-98 74 -196 0 Z" fill="url(#gold)"/>
    <path d="M-76 110 q76 50 152 0" stroke="#203a6e" stroke-width="6" fill="none"/>
    <circle cx="0" cy="128" r="12" fill="url(#goldFace)" stroke="#cf8f24" stroke-width="3"/>
    <circle cx="0" cy="128" r="4.5" fill="#203a6e"/>
  </g>
</svg>
