name: Deploy Klotracker to GitHub Pages

on:
  push:
    branches:
      - claude/toilet-tracker-app-jf9vuw
  workflow_dispatch:

# contents: write  -> um den gebauten Stand auf den gh-pages-Branch zu pushen
# pages:    write  -> um die Pages-Quelle per API auf gh-pages zu stellen
permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Projekt-Site liegt unter /Klotracker/ – Basis-Pfad entsprechend setzen.
          BASE_PATH: /Klotracker/

      - name: Prepare artifact
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html   # SPA-Fallback für Deep-Links

      - name: Publish to gh-pages branch
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point GitHub Pages at gh-pages branch
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          body='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'

          echo "== Aktuelle Pages-Konfiguration =="
          curl -s "${auth[@]}" "$api" || true; echo

          echo "== Versuche PUT (Quelle -> gh-pages) =="
          put=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PUT "${auth[@]}" "$api" -d "$body")
          echo "PUT HTTP $put"; cat /tmp/resp.json 2>/dev/null; echo

          if [ "$put" != "204" ] && [ "$put" != "200" ]; then
            echo "== PUT nicht ok, versuche POST (Pages neu anlegen) =="
            post=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST "${auth[@]}" "$api" -d "$body")
            echo "POST HTTP $post"; cat /tmp/resp.json 2>/dev/null; echo
            put="$post"
          fi

          echo "== Pages-Konfiguration danach =="
          curl -s "${auth[@]}" "$api"; echo

          # Hinweis statt Fehlschlag: Das Umschalten der Pages-Quelle erfordert
          # Admin-Rechte, die der Workflow-Token nicht hat. Der gebaute Stand
          # liegt trotzdem aktuell im Branch gh-pages bereit. Einmalig nötig:
          #   Settings -> Pages -> Source = "Deploy from a branch"
          #   -> Branch: gh-pages / (root) -> Save
          if [ "$put" != "204" ] && [ "$put" != "200" ] && [ "$put" != "201" ]; then
            echo "::notice::Pages-Quelle nicht automatisch setzbar (Token ohne Admin-Recht). Bitte einmalig unter Settings -> Pages die Quelle auf Branch 'gh-pages' /(root) stellen."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
