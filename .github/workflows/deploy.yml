name: Deploy Klotracker to GitHub Pages

# Standard-Deployment über GitHub Actions – wie bei den anderen Projekten.
# Gebaut und veröffentlicht wird der Stand auf main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Die App selbst läuft nur nativ (Capacitor). Unter der Domain liegt die
      # Landingpage aus site/ plus die rechtlichen Seiten aus public/, die auch
      # in der App gebündelt sind (Store-Pflicht: öffentliche Datenschutz-URL).
      - name: Assemble landing page
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp public/datenschutz.html public/impressum.html public/icon.svg public/CNAME _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
